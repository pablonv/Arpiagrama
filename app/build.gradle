plugins {
    id 'com.android.application'
}

def contextDescriptionEndpoint = System.getenv("CONTEXT_DESCRIPTION_ENDPOINT") ?: project.findProperty("CONTEXT_DESCRIPTION_ENDPOINT")
if (contextDescriptionEndpoint == null) {
    contextDescriptionEndpoint = ""
}
contextDescriptionEndpoint = contextDescriptionEndpoint.toString().replace("\\", "\\\\").replace('"', '\\"')

android {
    namespace 'com.example.arpiagrama'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.arpiagrama"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CONTEXT_DESCRIPTION_ENDPOINT", "\"${contextDescriptionEndpoint}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    aaptOptions {
        noCompress "tflite", "task"
    }
    packaging {
        resources {
            excludes += "/META-INF/{DEPENDENCIES}"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'com.google.ai.edge.litert:litert:2.1.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.mediapipe:tasks-vision:latest.release'
}

def handLandmarkerUrl = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
def handLandmarkerFile = file("$projectDir/src/main/assets/hand_landmarker.task")



preBuild.dependsOn("downloadHandLandmarker")


tasks.register("downloadHandLandmarker") {
    outputs.file(handLandmarkerFile)
    doLast {
        if (handLandmarkerFile.exists() && handLandmarkerFile.length() > 1_000_000L) {
            println("Hand Landmarker já presente (${handLandmarkerFile.length()} bytes).")
            return
        }

        println("Baixando modelo de mãos para ${handLandmarkerFile}")
        handLandmarkerFile.parentFile.mkdirs()

        try {
            new URL(handLandmarkerUrl).withInputStream { input ->
                handLandmarkerFile.withOutputStream { output ->
                    output << input
                }
            }
        } catch (Exception e) {
            throw new GradleException("Não foi possível baixar o modelo de detecção de mãos: ${e.message}", e)
        }

        if (handLandmarkerFile.length() <= 1_000_000L) {
            throw new GradleException("Download do modelo de mãos incompleto. O arquivo parece inválido.")
        }
    }
}




